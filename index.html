<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座標検索マップ（完全内蔵版）</title>
  <style>
    body { font-family: sans-serif; margin: 15px; background: #f4f6f8; color: #333; }
    .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 130px; }
    button { padding: 10px 18px; font-size: 15px; font-weight: bold; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.sub { background: #555; padding: 8px 14px; }
    /* 地図を表示する枠（3×3のタイルを並べる） */
    .map-container { position: relative; width: 100%; max-width: 600px; height: 450px; overflow: hidden; border: 2px solid #333; border-radius: 8px; background: #ddd; margin: auto; }
    #tileGrid { position: absolute; width: 768px; height: 768px; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; grid-template-columns: repeat(3, 256px); grid-template-rows: repeat(3, 256px); }
    #tileGrid img { width: 256px; height: 256px; display: block; }
    /* 中央に立つ赤いピン */
    .pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); font-size: 36px; z-index: 10; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
    .controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; align-items: center; }
    #info { font-size: 13px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="panel">
    <strong>📍 座標から場所を特定（ブロック回避・内蔵版）</strong>
    <div class="row">
      <input type="text" id="both" placeholder="まとめて貼付 (例: 35.6812, 139.7671)" oninput="autoSplit()">
    </div>
    <div class="row">
      <input type="text" id="lat" placeholder="緯度 (例: 35.6812)" value="35.6812">
      <input type="text" id="lng" placeholder="経度 (例: 139.7671)" value="139.7671">
      <button onclick="renderMap()">場所を表示</button>
    </div>
    <div id="info">ズーム倍率: 15</div>
  </div>

  <!-- 地図表示エリア -->
  <div class="map-container">
    <div id="tileGrid"></div>
    <div class="pin">📍</div>
  </div>

  <!-- ズーム切り替えボタン -->
  <div class="controls">
    <button class="sub" onclick="changeZoom(-1)">－ 広域</button>
    <button class="sub" onclick="changeZoom(1)">＋ 詳細</button>
    <select id="mapSource" onchange="renderMap()" style="padding: 8px; font-size: 14px; border-radius: 4px;">
      <option value="gsi">国土地理院地図（日本国内・高精細）</option>
      <option value="osm">OpenStreetMap（全世界対応）</option>
    </select>
  </div>

  <script>
    let currentZoom = 15;

    function clean(str) {
      return str.replace(/[０-９．－]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[^0-9.-]/g, '');
    }

    function autoSplit() {
      const val = document.getElementById('both').value;
      const parts = val.split(/[,、\s　]+/);
      if (parts.length >= 2) {
        document.getElementById('lat').value = clean(parts);
        document.getElementById('lng').value = clean(parts);
      }
    }

    function changeZoom(delta) {
      currentZoom = Math.min(18, Math.max(5, currentZoom + delta));
      renderMap();
    }

    function renderMap() {
      const lat = parseFloat(clean(document.getElementById('lat').value));
      const lng = parseFloat(clean(document.getElementById('lng').value));

      if (isNaN(lat) || isNaN(lng) || lat < -85 || lat > 85 || lng < -180 || lng > 180) {
        alert("正しい緯度（-85〜85）と経度（-180〜180）を入力してください");
        return;
      }

      const z = currentZoom;
      const n = Math.pow(2, z);
      // 緯度経度を地図タイルの座標（ピクセル単位）に変換
      const xExact = ((lng + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const yExact = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;

      const xTile = Math.floor(xExact);
      const yTile = Math.floor(yExact);

      // タイル内のズレ（ピクセル）を計算してピンが正確な位置に来るように調整
      const offsetX = (xExact - xTile) * 256;
      const offsetY = (yExact - yTile) * 256;

      const grid = document.getElementById('tileGrid');
      grid.innerHTML = '';
      // 中央のタイル(1,1)の基準点からズレ分だけ移動させる
      grid.style.transform = `translate(calc(-256px - ${offsetX}px), calc(-256px - ${offsetY}px))`;

      const source = document.getElementById('mapSource').value;

      // 周囲3x3（計9枚）の地図画像を並べる
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const tx = xTile + dx;
          const ty = yTile + dy;
          const img = document.createElement('img');
          if (source === 'gsi') {
            img.src = `https://gsi.go.jp{z}/${tx}/${ty}.png`;
          } else {
            img.src = `https://openstreetmap.org{z}/${tx}/${ty}.png`;
          }
          grid.appendChild(img);
        }
      }

      document.getElementById('info').innerText = `表示中: 緯度 ${lat}, 経度 ${lng}（ズーム: ${z}）`;
    }

    // 初期表示
    window.onload = renderMap;
  </script>
</body>
</html>
