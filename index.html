<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座標検索マップ</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <style>
    body { font-family: sans-serif; margin: 12px; background: #f8f9fa; }
    .panel { background: white; padding: 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    #map { height: 450px; width: 100%; border-radius: 8px; border: 1px solid #ccc; }
    #msg { font-size: 13px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="panel">
    <strong>📍 座標から場所を特定</strong>
    <div class="row">
      <input type="text" id="both" placeholder="まとめて貼付 (例: 35.6812, 139.7671)" oninput="splitInput()">
    </div>
    <div class="row">
      <input type="text" id="lat" placeholder="緯度 (例: 35.6812)" value="35.6812">
      <input type="text" id="lng" placeholder="経度 (例: 139.7671)" value="139.7671">
      <button onclick="movePin()">表示</button>
    </div>
    <div id="msg">座標を入力して「表示」を押してください</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com"></script>
  <script>
    // 地図の初期化（東京駅を初期表示）
    const map = L.map('map').setView([35.6812, 139.7671], 15);

    // 国土地理院の標準地図を読み込む
    L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
      attribution: "<a href='https://gsi.go.jp' target='_blank'>国土地理院</a>",
      maxZoom: 18
    }).addTo(map);

    // ピンを設置
    let marker = L.marker([35.6812, 139.7671]).addTo(map);

    // 全角数字を半角に変換して数値のみ抽出
    function toNumber(str) {
      const half = str.replace(/[０-９．－]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      });
      const clean = half.replace(/[^0-9.-]/g, '');
      return parseFloat(clean);
    }

    // まとめて貼り付けられた座標を分割する
    function splitInput() {
      const text = document.getElementById('both').value;
      const parts = text.split(/[,、\s　]+/);
      if (parts.length >= 2) {
        const v1 = toNumber(parts);
        const v2 = toNumber(parts);
        if (!isNaN(v1)) document.getElementById('lat').value = v1;
        if (!isNaN(v2)) document.getElementById('lng').value = v2;
      }
    }

    // 入力された座標へ地図とピンを移動する
    function movePin() {
      const lat = toNumber(document.getElementById('lat').value);
      const lng = toNumber(document.getElementById('lng').value);

      if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        alert("正しい緯度と経度を入力してください（例: 35.6812 と 139.7671）");
        return;
      }

      map.setView([lat, lng], 16);
      marker.setLatLng([lat, lng]);
      document.getElementById('msg').innerText = "表示中の座標: " + lat + ", " + lng;
    }
  </script>
</body>
</html>
